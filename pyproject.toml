[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fa4>=4.0.0b3",
    "kernels>=0.12.2",
    "numpy>=2.4.3",
    "pyarrow>=23.0.1",
    "requests>=2.32.5",
    "rustbpe>=0.1.0",
    "tiktoken>=0.12.0",
    "torch==2.10.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
